# Advanced example: a creator/content pipeline that produces a multi-platform
# DRAFT package and a publish checklist. It never publishes anything.
# Fully offline — sample materials, no network or API keys.
#
# The steps come from the runspool-example-creator plugin package
# (plugins/runspool-example-creator), mounted by its entry-point name. The plugin
# also contributes the `creator_publishing` workflow:
#   collect_materials -> extract_highlights -> draft_article
#     -> render_platform_package -> create_publish_checklist -> archive
workspace_root: ./workspace

patch:
  - insert:
      - {id: creator, plugin: example-creator}
