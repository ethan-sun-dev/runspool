[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspool-wechat"
version = "0.2.0.dev0"
description = "Official RunSpool plugin: lay out Markdown for WeChat Official Accounts and create drafts (behind an approval)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ethan Sun", email = "ethan@ethansun.dev" }]
keywords = ["runspool", "wechat", "weixin", "official-account", "markdown"]
dependencies = [
    "runspool>=0.2.0.dev0,<0.3",
    "markdown-it-py>=3.0",
]

[project.entry-points."runspool.plugins"]
wechat = "runspool_wechat:plugin"

[project.entry-points."runspool.bundles"]
wechat = "runspool_wechat:BUNDLE"

[tool.uv.sources]
runspool = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/runspool_wechat"]
