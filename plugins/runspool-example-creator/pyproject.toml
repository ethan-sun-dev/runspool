[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspool-example-creator"
version = "0.2.0.dev0"
description = "Example RunSpool plugin: build a multi-platform draft package from raw materials."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ethan Sun", email = "ethan@ethansun.dev" }]
dependencies = ["runspool>=0.2.0.dev0,<0.3"]

[project.entry-points."runspool.plugins"]
example-creator = "runspool_example_creator:plugin"

[tool.uv.sources]
runspool = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/runspool_example_creator"]
